name: ci
on: [push, pull_request]
jobs:
  fresh-clone-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # The exact buyer path: clone -> install -> test. This job existing
      # earlier would have caught the 98-failure DOA state automatically.
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_listing/ -q
  unarmed-still-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # No pillars installed at all: the swarm must still route (declared
      # unarmed), with ONLY the explicit six-pillars-armed test failing.
      # cryptography is NOT a pillar - signing is core, always required.
      - run: pip install pytest cryptography
      - run: |
          python -m pytest tests_listing/ -q > out.txt 2>&1 || true
          tail -1 out.txt
          grep -q "1 failed" out.txt
          grep -q "test_all_six_pillars_fire_on_listing_traffic" out.txt
  windows-desk:
    timeout-minutes: 15
    # The Broker Desk on Windows, run for real (added 2026-10-12): the
    # desk lock's pid check takes a different branch there (OpenProcess /
    # GetExitCodeProcess - os.kill(pid, 0) would END the process), and a
    # clean stop is Ctrl+Break, not SIGTERM.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_listing/test_desk.py -q
  windows-full-suite:
    # The whole suite on Windows, a gate since run 38321234628 (1003 passed
    # then; today's count is in QUICKSTART_WINDOWS.md, held by test_doc_counts).
    # It takes ~5-10 min there: every audit write is fsynced, and Windows
    # flushes slowly. QUICKSTART_WINDOWS.md promises this result.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      # -v names each test as it runs; faulthandler dumps every thread's
      # stack if one test runs past 120 s, so a hang names itself
      - run: python -m pytest tests_listing/ -v -p no:cacheprovider -o faulthandler_timeout=120
