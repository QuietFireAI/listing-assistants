name: ci
on: [push, pull_request]
jobs:
  fresh-clone-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # The exact buyer path: clone -> install -> test. This job existing
      # earlier would have caught the 98-failure DOA state automatically.
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_listing/ -q
      # agent isolation V1 (owner decisions 2026-10-26): each agent in its
      # own process behind its portal; Unix sockets, so Linux only
      - run: python -m pytest tests_isolation/ -q -p no:cacheprovider
  linux-containers:
    # Agent isolation V1 in real containers: the dispatcher, the desk door,
    # the alert door and twenty agents, built from this commit and run with
    # Docker; a playbook, the lock-down of an agent container, the Desk
    # through its door, and a rogue agent stopped (tests_isolation/test_containers.py)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_isolation/test_containers.py -v -p no:cacheprovider
        env:
          LA_DOCKER_TESTS: "1"
  windows-desk:
    timeout-minutes: 15
    # The Broker Desk on Windows, run for real (added 2026-10-12): the
    # desk lock's pid check takes a different branch there (OpenProcess /
    # GetExitCodeProcess - os.kill(pid, 0) would END the process), and a
    # clean stop is Ctrl+Break, not SIGTERM.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_listing/test_desk.py -q
  windows-installer:
    # The one-line installer, run for real on a Windows machine (owner
    # decision 2026-10-21): a private Python through uv, the app from this
    # exact commit, the operator key and onboarding, the launchers. Then the
    # installed copy plays all 24 playbooks on the desk, the desk starts on
    # the installed records, and a second run keeps those records.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LA_HOME: ${{ github.workspace }}\..\LA
      LA_REF: ${{ github.sha }}
      LA_NAME: CI Broker
      LA_LOGIN: ci@example.test
      LA_NO_SHORTCUTS: "1"
      HERMES_HOME: ${{ github.workspace }}\..\hermes
    steps:
      - name: a Hermes already set up, with one server of its own (owner decision 2026-10-22, Hermes first)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:HERMES_HOME | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $env:HERMES_HOME "config.yaml"), "model: x`nmcp_servers:`n  github:`n    command: npx`n")
      - name: install with the one line, from this commit (Windows PowerShell 5.1, what brokers have)
        shell: powershell
        run: iex (irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1")
      - name: the installed copy runs on its own Python and plays the playbooks
        shell: pwsh
        run: |
          $home_ = [System.IO.Path]::GetFullPath($env:LA_HOME)
          $py = Join-Path $home_ "venv\Scripts\python.exe"
          $base = & $py -c "import sys; print(sys.base_prefix)"
          Write-Host "base Python: $base"
          if (-not $base.StartsWith((Join-Path $home_ "python"), [System.StringComparison]::OrdinalIgnoreCase)) { throw "not the private Python: $base" }
          Set-Location (Join-Path $env:LA_HOME "app")
          & $py -m pytest tests_listing/test_desk.py -k "playbook_show or outbox" -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { throw "the playbook show failed in the installed copy" }
      - name: the desk starts on the installed records and answers
        shell: pwsh
        run: |
          $py = Join-Path $env:LA_HOME "venv\Scripts\python.exe"
          $env:LISTINGASSISTANTS_STATE_DIR = Join-Path $env:LA_HOME "state"
          $desk = Join-Path $env:LA_HOME "app\tools\desk.py"
          $p = Start-Process -FilePath $py -ArgumentList "`"$desk`"" -PassThru -NoNewWindow
          $state = $null
          for ($i = 0; $i -lt 60 -and -not $state; $i++) {
            Start-Sleep -Seconds 1
            try { $state = Invoke-RestMethod http://127.0.0.1:8765/api/state } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $state) { throw "the desk did not answer in 60 s" }
          Write-Host "mode: $($state.mode)  operator: $($state.operator.login)"
          if ($state.mode -ne "live" -or $state.operator.login -ne "ci@example.test") { throw "wrong desk" }
          $lock = Join-Path $env:LISTINGASSISTANTS_STATE_DIR "desk.lock"
          if (Test-Path $lock) { Remove-Item $lock }   # the hard stop left it behind
      - name: the Playbook Show launcher serves the show on 8766
        shell: pwsh
        run: |
          $cmd = Join-Path $env:LA_HOME "Playbook Show.cmd"
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"`"$cmd`"`"" -PassThru -WindowStyle Hidden
          $state = $null
          for ($i = 0; $i -lt 90 -and -not $state; $i++) {
            Start-Sleep -Seconds 1
            try { $state = Invoke-RestMethod http://127.0.0.1:8766/api/state } catch {}
          }
          taskkill /T /F /PID $p.Id | Out-Null
          if (-not $state) { throw "the Playbook Show launcher did not answer on 8766 in 90 s" }
          Write-Host "mode: $($state.mode)  title: $($state.showcase.title)"
          if ($state.mode -ne "playbooks" -or -not $state.showcase.title.StartsWith("P01")) { throw "not the playbook show" }
      - name: Hermes, started the way the installer set it up, works inside the running desk
        shell: pwsh
        run: |
          $py = Join-Path $env:LA_HOME "venv\Scripts\python.exe"
          & (Join-Path $env:LA_HOME "tools\uv.exe") pip install --python $py pyyaml   # for this check only; the reinstall below makes a fresh venv
          $env:LISTINGASSISTANTS_STATE_DIR = Join-Path $env:LA_HOME "state"
          $desk = Join-Path $env:LA_HOME "app\tools\desk.py"
          $p = Start-Process -FilePath $py -ArgumentList "`"$desk`"" -PassThru -NoNewWindow
          $state = $null
          for ($i = 0; $i -lt 60 -and -not $state; $i++) {
            Start-Sleep -Seconds 1
            try { $state = Invoke-RestMethod http://127.0.0.1:8765/api/state } catch {}
          }
          if (-not $state) { Stop-Process -Id $p.Id -Force; throw "the desk did not answer in 60 s" }
          $check = Join-Path $env:RUNNER_TEMP "hermes_check.py"
          $code = @'
          import asyncio, json, os, sys, urllib.request, yaml
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client
          cfg = yaml.safe_load(open(os.path.join(os.environ["HERMES_HOME"], "config.yaml"), encoding="utf-8"))
          assert sorted(cfg["mcp_servers"]) == ["github", "listingassistants"], cfg
          e = cfg["mcp_servers"]["listingassistants"]
          print("Hermes entry:", json.dumps(e))
          # only what the settings give, as a host starts it: no working folder, no extra environment
          params = StdioServerParameters(command=e["command"], args=e["args"], env=e["env"])
          async def run():
              async with stdio_client(params) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      out = {}
                      for k, tool, a in [("status", "identity.status", {}),
                                         ("lead", "identity.submit", {"intent": "lead.inbound", "context_id": "HERMES-CI",
                                                                      "payload": {"channel": "web_form", "name": "Pat Hermes",
                                                                                  "consent": {"email": "yes"}}}),
                                         ("sign", "identity.authority", {"intent": "listing.change.authorized", "payload": {}})]:
                          out[k] = json.loads((await s.call_tool(tool, a)).content[0].text)
                      return out
          out = asyncio.run(run())
          print(json.dumps(out, indent=1))
          assert out["status"]["ok"] and out["status"]["mode"] == "live", out["status"]
          assert out["lead"]["ok"], out["lead"]
          assert not out["sign"]["ok"] and "cannot sign" in out["sign"]["reason"], out["sign"]
          leads = [l["ctx"] for l in json.load(urllib.request.urlopen("http://127.0.0.1:8765/api/state"))["leads"]]
          assert "HERMES-CI" in leads, leads
          print("the lead Hermes brought in is on the desk:", leads)
          '@
          Set-Content -Path $check -Value $code
          Push-Location $env:RUNNER_TEMP
          & $py -I $check
          $rc = $LASTEXITCODE
          Pop-Location
          Stop-Process -Id $p.Id -Force
          $lock = Join-Path $env:LISTINGASSISTANTS_STATE_DIR "desk.lock"
          if (Test-Path $lock) { Remove-Item $lock }
          if ($rc -ne 0) { throw "Hermes could not work inside the desk" }
          if (-not (Test-Path (Join-Path $env:HERMES_HOME "config.yaml.bak-listingassistants"))) { throw "no copy of the old Hermes settings" }
      - name: a second run keeps your records and attests the new install
        shell: pwsh
        run: |
          $key = Join-Path $env:LA_HOME "state\operator-key.bin"
          $before = (Get-FileHash $key).Hash
          iex (irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1")
          if ((Get-FileHash $key).Hash -ne $before) { throw "the reinstall replaced your key" }
          $op = Get-Content (Join-Path $env:LA_HOME "state\operator.json") | ConvertFrom-Json
          if ($op.login -ne "ci@example.test") { throw "the reinstall lost who you are" }
          $n = ([regex]::Matches((Get-Content -Raw (Join-Path $env:HERMES_HOME "config.yaml")), "listingassistants:")).Count
          if ($n -ne 1) { throw "the reinstall wrote ListingAssistants into Hermes $n times" }
  windows-full-suite:
    # The whole suite on Windows, a gate since run 38321234628 (1003 passed
    # then; today's count is in QUICKSTART_WINDOWS.md, held by test_doc_counts).
    # It takes ~5-10 min there: every audit write is fsynced, and Windows
    # flushes slowly. QUICKSTART_WINDOWS.md promises this result.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      # -v names each test as it runs; faulthandler dumps every thread's
      # stack if one test runs past 120 s, so a hang names itself
      - run: python -m pytest tests_listing/ -v -p no:cacheprovider -o faulthandler_timeout=120
