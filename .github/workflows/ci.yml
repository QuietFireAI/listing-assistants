name: ci
on: [push, pull_request]
jobs:
  fresh-clone-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # The exact buyer path: clone -> install -> test. This job existing
      # earlier would have caught the 98-failure DOA state automatically.
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_listing/ -q
  core-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Owner decision D1 (2026-10-14): listing is checked against the exact
      # core commit it carries (CORE_PIN.json), not against core main as it
      # is today - so a core merge never turns listing red, and a release
      # names its core. Moving the pin is a deliberate commit (sync_core.py).
      - name: clone core at the pinned commit
        run: |
          PIN=$(python tools/sync_core.py --print-pin)
          git clone --quiet https://github.com/QuietFireAI/dispatcher-agents.git /tmp/core
          git -C /tmp/core checkout --quiet "$PIN"
          echo "core pinned at $PIN"
      # Fork-drift gate: the vendored dispatcher/ must match that commit exactly.
      # This job existing earlier would have caught the 105-line hub.py lag.
      - run: python tools/sync_core.py --core /tmp/core --check --require-pin
      # listing main may only carry a core that is on core main; checked on
      # a push to main and on a pull request into main (where github.ref is
      # refs/pull/N/merge, so the ref test alone would skip it)
      - name: on main, the pinned core must be on core main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          git -C /tmp/core merge-base --is-ancestor "$(python tools/sync_core.py --print-pin)" origin/main \
            && echo "pinned core is on core main" \
            || { echo "::error::CORE_PIN.json names a core commit that is not on core main"; exit 1; }
  unarmed-still-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # No pillars installed at all: the swarm must still route (declared
      # unarmed), with ONLY the explicit six-pillars-armed test failing.
      # cryptography is NOT a pillar - signing is core, always required.
      - run: pip install pytest cryptography
      - run: |
          python -m pytest tests_listing/ -q > out.txt 2>&1 || true
          tail -1 out.txt
          grep -q "1 failed" out.txt
          grep -q "test_all_six_pillars_fire_on_listing_traffic" out.txt
  windows-desk:
    timeout-minutes: 15
    # The Broker Desk on Windows, run for real (added 2026-10-12): the
    # desk lock's pid check takes a different branch there (OpenProcess /
    # GetExitCodeProcess - os.kill(pid, 0) would END the process), and a
    # clean stop is Ctrl+Break, not SIGTERM.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_listing/test_desk.py -q
  windows-full-suite:
    # The whole suite on Windows, a gate since run 38321234628 (1003 passed
    # then; today's count is in QUICKSTART_WINDOWS.md, held by test_doc_counts).
    # It takes ~5-10 min there: every audit write is fsynced, and Windows
    # flushes slowly. QUICKSTART_WINDOWS.md promises this result.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      # -v names each test as it runs; faulthandler dumps every thread's
      # stack if one test runs past 120 s, so a hang names itself
      - run: python -m pytest tests_listing/ -v -p no:cacheprovider -o faulthandler_timeout=120
