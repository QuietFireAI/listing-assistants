name: ci
on: [push, pull_request]
jobs:
  fresh-clone-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Clean-environment build verification: clone -> install -> test suite execution.
      - run: pip install -r requirements.txt
      - run: python -m pytest tests_listing/ -q
  core-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: clone core at main
        run: git clone --depth 1 https://github.com/QuietFireAI/dispatcher-agents.git /tmp/core
      # Fork-drift validation: ensures vendored core dispatcher files match upstream core exactly.
      - run: python tools/sync_core.py --core /tmp/core --check
  unarmed-still-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Graceful fallback routing verification: validates that the swarm safely routes
      # even if optional external cognitive pillar packages are absent.
      # Note: cryptography is core for Ed25519 signing and is always required.
      - run: pip install pytest cryptography
      - run: |
          python -m pytest tests_listing/ -q > out.txt 2>&1 || true
          tail -1 out.txt
          grep -q "1 failed" out.txt
          grep -q "test_all_six_pillars_fire_on_listing_traffic" out.txt
